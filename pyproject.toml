[project]
name = "rag-assistant"
version = "0.1.0"
description = "Retrieval-augmented question answering over a climate and air quality knowledge base"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
